<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Grid dots pattern -->
  <g opacity="0.08">
    <circle cx="16" cy="16" r="1.5" fill="#00d4ff"/>
    <circle cx="32" cy="16" r="1.5" fill="#00d4ff"/>
    <circle cx="48" cy="16" r="1.5" fill="#00d4ff"/>
    <circle cx="64" cy="16" r="1.5" fill="#00d4ff"/>
    <circle cx="80" cy="16" r="1.5" fill="#00d4ff"/>
    <circle cx="96" cy="16" r="1.5" fill="#00d4ff"/>
    <circle cx="112" cy="16" r="1.5" fill="#00d4ff"/>
    <circle cx="16" cy="32" r="1.5" fill="#00d4ff"/>
    <circle cx="16" cy="48" r="1.5" fill="#00d4ff"/>
    <circle cx="16" cy="64" r="1.5" fill="#00d4ff"/>
    <circle cx="16" cy="80" r="1.5" fill="#00d4ff"/>
    <circle cx="16" cy="96" r="1.5" fill="#00d4ff"/>
    <circle cx="16" cy="112" r="1.5" fill="#00d4ff"/>
    <circle cx="112" cy="32" r="1.5" fill="#00d4ff"/>
    <circle cx="112" cy="48" r="1.5" fill="#00d4ff"/>
    <circle cx="112" cy="64" r="1.5" fill="#00d4ff"/>
    <circle cx="112" cy="80" r="1.5" fill="#00d4ff"/>
    <circle cx="112" cy="96" r="1.5" fill="#00d4ff"/>
    <circle cx="112" cy="112" r="1.5" fill="#00d4ff"/>
    <circle cx="32" cy="112" r="1.5" fill="#00d4ff"/>
    <circle cx="48" cy="112" r="1.5" fill="#00d4ff"/>
    <circle cx="64" cy="112" r="1.5" fill="#00d4ff"/>
    <circle cx="80" cy="112" r="1.5" fill="#00d4ff"/>
    <circle cx="96" cy="112" r="1.5" fill="#00d4ff"/>
  </g>

  <!-- Code bracket {} left -->
  <path d="M28 42 Q20 48 20 54 Q20 60 28 64" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <!-- Code bracket {} right -->
  <path d="M100 42 Q108 48 108 54 Q108 60 100 64" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Neural network nodes -->
  <circle cx="38" cy="64" r="3" fill="#00d4ff" opacity="0.3"/>
  <circle cx="64" cy="48" r="3" fill="#00d4ff" opacity="0.3"/>
  <circle cx="90" cy="64" r="3" fill="#00d4ff" opacity="0.3"/>
  <circle cx="64" cy="80" r="3" fill="#00d4ff" opacity="0.3"/>
  <line x1="38" y1="64" x2="64" y2="48" stroke="#00d4ff" stroke-width="0.5" opacity="0.15"/>
  <line x1="64" y1="48" x2="90" y2="64" stroke="#00d4ff" stroke-width="0.5" opacity="0.15"/>
  <line x1="90" y1="64" x2="64" y2="80" stroke="#00d4ff" stroke-width="0.5" opacity="0.15"/>
  <line x1="64" y1="80" x2="38" y2="64" stroke="#00d4ff" stroke-width="0.5" opacity="0.15"/>

  <!-- Monogram A -->
  <path d="M44 86 L64 38 L84 86" fill="none" stroke="url(#ab)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="50" y1="74" x2="78" y2="74" stroke="url(#ab)" stroke-width="5" stroke-linecap="round"/>

  <!-- Glow effect -->
  <path d="M44 86 L64 38 L84 86" fill="none" stroke="url(#ab)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.15" filter="url(#glow)"/>
</svg>