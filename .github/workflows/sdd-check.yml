name: SDD Consistency Check

on:
  pull_request:
    paths:
      - 'src/**/*.ts'
  push:
    paths:
      - 'src/**/*.ts'

jobs:
  sdd-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check spec consistency (src/X.ts → specs/X.md)
        run: |
          CHANGED_TS=$(git diff --name-only HEAD~1 HEAD -- 'src/**/*.ts' 2>/dev/null || echo "")
          CHANGED_SPECS=$(git diff --name-only HEAD~1 HEAD -- 'specs/**/*.md' 2>/dev/null || echo "")

          if [ -z "$CHANGED_TS" ]; then
            echo "✅ No .ts changes — skipping SDD check."
            exit 0
          fi

          echo "Changed .ts files:"
          echo "$CHANGED_TS"

          VIOLATIONS=0

          for ts_file in $CHANGED_TS; do
            component=$(basename "$ts_file" .ts)

            case "$component" in
              index|types|extension|registerCommands|base|diff|ContextBuilder|GhostTextManager|ChatPanel)
                echo "  ⏭️  $ts_file — exempt (infrastructure)" ;;
              *)
                spec_file="specs/${component}.md"
                if echo "$CHANGED_SPECS" | grep -qF "$spec_file"; then
                  echo "  ✅ $ts_file → $spec_file"
                else
                  echo "  ❌ $ts_file → $spec_file NOT updated"
                  VIOLATIONS=$((VIOLATIONS + 1))
                fi ;;
            esac
          done

          if [ $VIOLATIONS -gt 0 ]; then
            echo ""
            echo "❌ SDD VIOLATION: $VIOLATIONS component(s) without updated spec."
            echo "   Please update the relevant specs/<Component>.md file."
            exit 1
          fi

          echo "✅ All components have updated specs."
