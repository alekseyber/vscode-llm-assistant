name: SDD Consistency Check

on:
  pull_request:
    paths:
      - 'src/**/*.ts'
      - 'specs/**/*.md'
  push:
    paths:
      - 'src/**/*.ts'
      - 'specs/**/*.md'
  # Ручной запуск: проверить согласованность на любой ревизии без изменений в src
  workflow_dispatch:

jobs:
  sdd-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Правило живёт в одном месте — scripts/sdd-check.sh; он же стоит локально как
      # pre-commit хук. Пока в CI был инлайн-дубль, локальная проверка была слабее
      # (не проверяла бамп version), и коммиты уходили красными только после пуша.
      - name: Check spec consistency (src/X.ts → specs/X.md)
        run: bash scripts/sdd-check.sh --range HEAD~1..HEAD
