# Публикация расширения в VS Code Marketplace
# Аутентификация: Microsoft Entra ID (Managed Identity) через OIDC
# Триггер: git-тэг v* или ручной запуск
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - run: npm ci
      - run: npm run compile

      # Вход через Entra ID (без PAT)
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Публикация с Entra-аутентификацией
      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --azure-credential
