# Публикация расширения в VS Code Marketplace
# Аутентификация: Microsoft Entra ID (Managed Identity) через OIDC
# Триггер: git-тэг v* или ручной запуск
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # Гейт релиза: перед сборкой VSIX прогоняется весь Test (spec-validate, lint,
  # check-any-budget, test-unit, test-e2e) на тегируемом коммите.
  # Переиспользуем reusable-воркфлоу, а не копию шагов: иначе релизный гейт
  # со временем разойдётся с обычным CI и перестанет ловить то, что ловит он.
  tests:
    uses: ./.github/workflows/test.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    environment: marketplace-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # Тег неизменяем (ruleset на refs/tags/v*): ошибку в имени уже не исправить
      # перестановкой. vsce публикует версию из package.json, а не из тега, поэтому
      # без сверки они молча разъезжаются — тег врёт, Marketplace получает другое.
      - name: Сверить тег с версией пакета
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "тег: $GITHUB_REF_NAME | package.json: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::тег v$TAG не совпадает с version $PKG в package.json"
            exit 1
          fi

      - run: npm ci
      - run: npm run compile

      # Вход через Entra ID (без PAT)
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Страховка перед публикацией: собранный пакет должен загружаться без node_modules.
      # 09.11 в Marketplace чуть не уехал пакет, где dist был собран tsc и падал на require("openai").
      # Пакет собираем ОДИН раз: проверяем ровно тот файл, который публикуем.
      - name: Собрать и проверить VSIX
        run: |
          npx @vscode/vsce package --out /tmp/publish.vsix
          python3 scripts/check-vsix-loads.py /tmp/publish.vsix

      # Публикация с Entra-аутентификацией: тот же артефакт, что проверен выше
      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --azure-credential --packagePath /tmp/publish.vsix
