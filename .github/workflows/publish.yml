# Публикация расширения в VS Code Marketplace
# Аутентификация: Microsoft Entra ID (Managed Identity) через OIDC
# Триггер: git-тэг v* или ручной запуск
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - run: npm ci
      - run: npm run compile

      # Вход через Entra ID (без PAT)
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Страховка перед публикацией: собранный пакет должен загружаться без node_modules.
      # 09.11 в Marketplace чуть не уехал пакет, где dist был собран tsc и падал на require("openai").
      # Пакет собираем ОДИН раз: проверяем ровно тот файл, который публикуем.
      - name: Собрать и проверить VSIX
        run: |
          npx @vscode/vsce package --out /tmp/publish.vsix
          python3 scripts/check-vsix-loads.py /tmp/publish.vsix

      # Публикация с Entra-аутентификацией: тот же артефакт, что проверен выше
      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --azure-credential --packagePath /tmp/publish.vsix
