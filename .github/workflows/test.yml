name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  spec-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/spec-validate.js

  lint:
    runs-on: ubuntu-latest
    needs: spec-validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm run check:mock
      - run: npm run check:changelog

  # Бюджет `as any` в тестах — отдельная работа: при падении сразу видно, что дело в бюджете
  check-any-budget:
    runs-on: ubuntu-latest
    needs: spec-validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Бюджет `as any` (пофайловый ратчет)
        run: node scripts/test-any-count.js
      - name: Дифф бюджета в сводке
        if: always()
        run: |
          {
            echo '## Бюджет `as any`'
            echo 'Рост допустим только с записью `reasons` (причина + дата). Снижение — приветствуется.'
            echo '```'
            git diff -- test/any-budget.json | head -60 || true
            node scripts/test-any-count.js || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Юнит-тесты с мок-vscode (npm run test:mocked) — быстрые, без реального VS Code
  test-unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tsc -p tsconfig.test.json
      - name: Приёмка поиска (индекс против grep)
        # Пороги из ревью Pro: recall@5 ≥ 70%, strict@5 ≥ 45%, MRR ≥ 0.45, P@1 ≥ 30%,
        # на негативных запросах — ни одного уверенного совпадения
        run: |
          npm run compile
          npm run check:acceptance

      - name: Unit tests
        run: |
          set -o pipefail
          npm run test:mocked 2>&1 | tee unit.log
      - name: Проверка числа mocked-тестов в README
        run: |
          MOCKED=$(grep -oE '[0-9]+ passing' unit.log | head -1 | grep -oE '^[0-9]+')
          if [ -z "$MOCKED" ]; then
            echo "не нашёл N passing в выводе юнит-тестов"
            exit 1
          fi
          node scripts/check-readme-counts.js --mocked="$MOCKED"

  # E2E в реальном VS Code (npm test → @vscode/test-electron) — нужны GTK-библиотеки Electron + xvfb
  # E2E не должен зависеть от test-unit: иначе любой дефект, который ловят юниты,
  # красит test-unit и e2e пропускается — доказать «e2e это тоже ловит» невозможно.
  test-e2e:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run compile
      - run: npx tsc -p tsconfig.test.json
      - name: Проверка бандла dist
        run: |
          SIZE=$(stat -c%s dist/extension.js)
          echo "dist/extension.js: $SIZE байт"
          if [ "$SIZE" -lt 500000 ]; then
            echo "бандл подозрительно мал — dist собран tsc, а не webpack"
            exit 1
          fi
          if grep -q 'require("openai")' dist/extension.js; then
            echo "в бандле остался внешний require(openai): node_modules в пакет не попадает"
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxshmfence1 libpango-1.0-0 libcairo2
      - name: Проверка собранного VSIX (бандл грузится без node_modules)
        run: |
          npx --no-install vsce package --out /tmp/smoke.vsix
          python3 scripts/check-vsix-loads.py /tmp/smoke.vsix

      - name: Run E2E tests
        run: |
          set -o pipefail
          xvfb-run --auto-servernum npm test 2>&1 | tee e2e.log
      - name: Проверка числа e2e в README
        run: |
          E2E=$(grep -oE '[0-9]+ passing' e2e.log | head -1 | grep -oE '^[0-9]+')
          if [ -z "$E2E" ]; then
            echo "не нашёл N passing в выводе e2e"
            exit 1
          fi
          node scripts/check-readme-counts.js --e2e="$E2E"
