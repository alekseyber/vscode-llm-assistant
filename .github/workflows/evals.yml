name: Evals

# Прогон качества ответов (P12). Триггеры выбраны так, чтобы сигнал был, а шума и трат — нет:
#   - тег v* — гейт перед публикацией (главный случай);
#   - раз в неделю — канарейка на молчаливый дрейф модели у провайдера;
#   - вручную — когда меняем модель, промпт или сам набор задач.
# На каждый пуш не запускаем: регресс качества не ломает сборку, он накапливается,
# и десяток одинаковых отчётов в день никто не читает.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'      # воскресенье 03:00 МСК
  push:
    tags:
      - 'v*'

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Прогон evals и проверка порога
        env:
          # Отдельный ключ под evals: отзывается, не задевая остальные сценарии
          DEEPSEEK_EVALS_KEY: ${{ secrets.DEEPSEEK_EVALS_KEY }}
        run: node scripts/evals/run.mjs --judge=deepseek-chat --judge-provider=deepseek --budget=0.5

      - name: Отчёт в артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: reports/evals/
          if-no-files-found: warn
